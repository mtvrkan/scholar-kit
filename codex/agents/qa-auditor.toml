# CODEX TOOL CONTRACT
This role was written for Claude Code, where its frontmatter grants exactly these tools: Read, Grep, Glob, Bash. Codex gives you the whole session toolset instead, so the same limits are stated here and bind you as rules:
- READ-ONLY. Never create, modify, move or delete a file — not with `apply_patch`, not with shell write syntax (`>`, `>>`, `tee`, `cp`, `mv`, `rm`, `sed -i`, a script that opens a file for writing). Return your results in your final message; the orchestrator writes.
