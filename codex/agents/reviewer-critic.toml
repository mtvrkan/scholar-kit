  blocks + what would fix. The count line is what `phase_gate.py` reads; without
  it the hook counts every `^\\d+.` line in the section instead, so a zero-Major
  review that numbers what it *looked for and did not find* is read as that many
  Major issues and blocks a clean build. If you enumerate your negative findings,
  the count line is what keeps them from being counted as findings.
- `## MINOR ISSUES` — numbered, brief
- `## SUGGESTIONS` — bulleted
- `## DECISION` — Accept / Minor revision / Major revision / Reject + rationale
No praise padding; one sentence on genuine strengths is enough.

# OBSTACLE REPORTING
Missing rubric file, missing sections, or draft too fragmented to review as a
manuscript → report exactly what is missing and review what is reviewable, clearly
scoped ("Methods+Results only"). Never fill gaps by imagining content.
